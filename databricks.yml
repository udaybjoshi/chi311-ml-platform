# Databricks Asset Bundle for the Chicago 311 Intelligence Platform.
#
# This bundle deploys a Lakeflow Declarative (DLT) pipeline plus a
# serverless Workflow Job that chains ingestion -> DLT -> data quality
# -> ML. Everything targets Databricks Free Edition (serverless only).
#
# Deploy:
#   databricks bundle validate
#   databricks bundle deploy --target dev
#   databricks bundle run chi311_daily
#
# For initial (historical) load, run with --params load_type=initial

bundle:
  name: chi311

include:
  # Allow per-resource YAML to live under ./resources/ in the future.
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog to target."
    default: workspace

  landing_path:
    description: "Volume path where the API-to-Volume notebook drops JSON files."
    default: /Volumes/workspace/raw/chi311_landing

  notifications_email:
    description: "Email to notify on job failure."
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Override with `databricks bundle deploy --target dev --profile <my-profile>`.
      # root_path stays workspace-relative so Free Edition picks up Git Folder
      # layouts automatically.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      pipelines:
        chi311_scd2:
          development: false
      jobs:
        chi311_daily:
          schedule:
            pause_status: UNPAUSED

resources:
  # ----------------------------------------------------------------------
  # Lakeflow Declarative Pipeline (Silver + Gold, SCD Type 2)
  # ----------------------------------------------------------------------
  pipelines:
    chi311_scd2:
      name: chi311_scd2_${bundle.target}
      serverless: true
      catalog: ${var.catalog}
      target: silver
      development: true
      continuous: false
      photon: true
      configuration:
        chi311.landing_path: ${var.landing_path}
      libraries:
        - file:
            path: ./pipelines/chi311_scd2_pipeline.sql

  # ----------------------------------------------------------------------
  # Serverless Job orchestrating the end-to-end pipeline
  # ----------------------------------------------------------------------
  jobs:
    chi311_daily:
      name: chi311_daily_${bundle.target}
      # Serverless compute is selected per-task; no job_clusters block
      # (not supported on Free Edition).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${var.notifications_email}
      schedule:
        # 06:00 America/Chicago every day (after Socrata's early-morning
        # refresh window).
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Chicago
        # PAUSED by default; override per-target below.
        pause_status: PAUSED

      parameters:
        - name: catalog_name
          default: ${var.catalog}
        - name: load_type
          default: incremental
        - name: days_back
          default: "1"

      tasks:
        - task_key: api_to_volume
          notebook_task:
            notebook_path: ./notebooks/02_ingestion/01_api_to_volume.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              load_type: "{{job.parameters.load_type}}"
              days_back: "{{job.parameters.days_back}}"

        - task_key: autoloader_to_bronze
          depends_on:
            - task_key: api_to_volume
          notebook_task:
            notebook_path: ./notebooks/02_ingestion/02_bronze_autoloader.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              source_path: all

        - task_key: dlt_silver_gold
          depends_on:
            - task_key: autoloader_to_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.chi311_scd2.id}
            full_refresh: false

        - task_key: data_quality_gate
          depends_on:
            - task_key: dlt_silver_gold
          notebook_task:
            notebook_path: ./notebooks/03_data_quality/01_data_quality_checks.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              fail_on_gate: "true"

        - task_key: train_forecast
          depends_on:
            - task_key: data_quality_gate
          notebook_task:
            notebook_path: ./notebooks/04_ml/01_train_forecast.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              forecast_horizon_days: "14"
